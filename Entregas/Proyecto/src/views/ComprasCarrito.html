<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/estilosCarrito.css">
    <link rel="stylesheet" href="../../css/sweetalert2.min.css">
  <!--   <link rel="stylesheet" type="text/css" href="../../css/csshake.min.css"> -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="../../js/jquery-3.1.1.min.js"></script>
    <script src="../../js/sweetAlert.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script defer src="../../js/cartList.js"></script>
    <script defer src="../../js/cart.js"></script>
    <title>CARRITO DE COMPRAS JUAN ANDRES GRAÑA</title>
<body>
    <header>    
        <div id="header">
            <nav>
                <div id="logoHeader"> <img src="../../img/logo.jpg" alt="Logo">
                    <a href="#"><img src="../../img/Configure002.png" alt="Modificaciones"></a>
                </div>
                <div>
                    <a href="#"><img src="../../img/busqueda.png" alt="Buscar"></a>
                    <a href="./carrito.html" id="carrito"><img  src="../../img/carrito-de-compras.png" alt="Carrito" class="shake"><!-- <span id="numero-carrito"></span> --></a>
                    <a><img src="../../img/cerrar-sesion red.png" alt="LOGOUT" onclick="alertaLogout()"></a>
                </div>
            </nav>
        </div>
    </header> 
    <main>
        <h1>COMPRAS REALIZADAS</h1>
        <div class="tablediv">
            <TABLE class="producto-tabla">
                <Thead>
                    <Tr>
                        <TH>    PRODUCTO    </TH>
                        <TH>    PRECIO    </Th>
                        <Th>    CANTIDAD    </Th>
                        <Th>    TOTAL    </Th>
                        <Th>    ACCIONES    </Th>
                    </Tr>
                </Thead>
                    <tbody id="carrito-items"></tbody>           
            </TABLE><BR>
            
                
            <table class="producto-tabla">
                <Thead>
                    <Tr>
                        <TH> NRO. ITEMS</TH>
                        <TH> SUBTOTAL  </Th>
                        <Th> IVA  </Th>
                        <Th> TOTAL </Th>
                    </Tr>
                </Thead>
                <tbody id="carrito-values"></tbody> 
            
            </table>    
            <DIV class="button-buy">
            <button class="btn002" onclick="comprarCarrito()"> COMPRAR </button></DIV>
        </div>
        
    </main>
</body>
</html>
